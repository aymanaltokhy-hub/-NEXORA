name: Publish web app to the repository root (GitHub Pages)
# Pages serves the main branch root, so the built site is committed there. Source entry: /app/index.html.
on:
  push:
    branches: [main]
    paths-ignore: ['assets/**', 'index.html', 'sw.js', 'manifest.webmanifest', 'icon-*.png', '.nojekyll']
  workflow_dispatch:
permissions: { contents: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - name: Copy the built site to the repository root and commit
        run: |
          rm -rf assets
          cp -r dist-web/. .
          touch .nojekyll
          git config user.name "madar-bot"
          git config user.email "madar-bot@users.noreply.github.com"
          git add -A assets index.html sw.js manifest.webmanifest icon-180.png icon-192.png icon-512.png .nojekyll
          git diff --cached --quiet || (git commit -m "Publish web build [skip ci]" && git push)

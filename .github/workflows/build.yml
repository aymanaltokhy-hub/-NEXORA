name: Build MADAR
on:
  push: { branches: [main], tags: ['v*'] }
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: npx vite build
      # Installer (NSIS) + portable zip. Signs automatically only if the CSC_LINK / CSC_KEY_PASSWORD secrets exist; otherwise unsigned.
      - name: Build Windows installer
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:CSC_LINK)) { Remove-Item Env:CSC_LINK -ErrorAction SilentlyContinue; Remove-Item Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue; $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false' }
          npx electron-builder --win --publish never -c.win.signAndEditExecutable=true 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $t = ((Get-Content build.log -Tail 30) -join '%0A') -replace '\x1b\[[0-9;]*m',''
            Write-Host "::error title=electron-builder failed::$t"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with: { name: madar-windows, path: "release/*.exe\nrelease/*.zip" }
      - uses: actions/upload-artifact@v4
        with: { name: madar-web, path: dist-web }
